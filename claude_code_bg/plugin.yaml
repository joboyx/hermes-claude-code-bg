name: claude-code-bg
kind: model-provider
version: 0.1.0
manifest_version: 2
description: Answer each Hermes chat with a Claude Code background session (claude --bg); Claude Code runs its own tools
author: Joboy Jordan
license: MIT
requires_hermes: ">=0.21.4"
platforms: []
optional_env:
  - CLAUDE_CODE_BG_COMMAND
  - CLAUDE_CODE_BG_SETTINGS
  - CLAUDE_CODE_BG_NAME_PREFIX
  - CLAUDE_CODE_BG_CWD
  - CLAUDE_CODE_BG_SYSTEM_PROMPT_FILE
  - CLAUDE_CODE_BG_PERSONA
  - CLAUDE_CODE_BG_EFFORT
  - CLAUDE_CODE_BG_MAX_LIVE
  - CLAUDE_CODE_BG_MAX_CHATS
  - CLAUDE_CODE_BG_MIN_MEM_MB
  - CLAUDE_CODE_BG_IDLE_STOP_S
external_dependencies:
  - name: claude
    check: "claude --version"
